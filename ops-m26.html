<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚙️</title>
<style>
  :root {
    --verde: #00c06b; --rojo: #e63329; --dorado: #f5c518;
    --negro: #0d0d0d; --gris-oscuro: #1a1a1a; --gris-medio: #2a2a2a;
    --gris-borde: #333; --texto: #f0f0f0; --texto-muted: #888; --card-bg: #161616;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--negro); color: var(--texto); font-family: system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { background: var(--card-bg); border: 1px solid var(--gris-borde); border-radius: 14px; padding: 28px; width: 100%; max-width: 420px; }
  h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--texto-muted); margin-bottom: 24px; }
  .campo { margin-bottom: 14px; }
  label { display: block; font-size: 11px; color: var(--texto-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  input { width: 100%; background: var(--gris-medio); border: 1px solid var(--gris-borde); border-radius: 8px; padding: 11px 14px; color: var(--texto); font-size: 15px; outline: none; transition: border-color 0.2s; font-family: inherit; }
  input:focus { border-color: var(--verde); }
  .btn { width: 100%; background: var(--verde); color: var(--negro); border: none; border-radius: 8px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 4px; font-family: inherit; }
  .btn:hover { background: #009952; }
  .btn:disabled { background: #444; color: #777; cursor: not-allowed; }
  .btn-secondary { background: transparent; border: 1px solid var(--gris-borde); color: var(--texto-muted); margin-top: 10px; }
  .btn-secondary:hover { border-color: var(--verde); color: var(--verde); background: transparent; }
  .msg { margin-top: 16px; padding: 12px 16px; border-radius: 8px; font-size: 14px; display: none; }
  .msg.ok { background: rgba(0,192,107,0.1); border: 1px solid rgba(0,192,107,0.4); color: var(--verde); display: block; }
  .msg.err { background: rgba(230,51,41,0.1); border: 1px solid rgba(230,51,41,0.4); color: var(--rojo); display: block; }
  .divider { border: none; border-top: 1px solid var(--gris-borde); margin: 24px 0; }
  #secLogin { display: block; }
  #secOps { display: none; }
  .badge { display: inline-block; background: rgba(0,192,107,0.15); border: 1px solid rgba(0,192,107,0.3); color: var(--verde); font-size: 11px; padding: 3px 10px; border-radius: 20px; margin-bottom: 20px; }

  /* Lista de participantes */
  .buscador { margin-bottom: 10px; }
  .lista-participantes { max-height: 260px; overflow-y: auto; border: 1px solid var(--gris-borde); border-radius: 8px; margin-bottom: 14px; }
  .part-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--gris-borde); transition: background 0.15s; font-size: 14px; }
  .part-item:last-child { border-bottom: none; }
  .part-item:hover { background: var(--gris-medio); }
  .part-item.seleccionado { background: rgba(0,192,107,0.12); border-left: 3px solid var(--verde); }
  .part-nombre { font-weight: 500; }
  .part-email { font-size: 11px; color: var(--texto-muted); margin-top: 2px; }
  .lista-vacia { padding: 16px; text-align: center; color: var(--texto-muted); font-size: 13px; }
  .spinner-mini { text-align: center; padding: 20px; color: var(--texto-muted); font-size: 13px; }

  .seleccionado-label { font-size: 12px; color: var(--verde); margin-bottom: 10px; padding: 8px 12px; background: rgba(0,192,107,0.08); border-radius: 6px; display: none; }
</style>
</head>
<body>
<div class="card">

  <!-- Sección login -->
  <div id="secLogin">
    <h2>⚙️ Operaciones</h2>
    <p class="sub">Panel de administración</p>
    <div class="campo">
      <label>Token de acceso</label>
      <input type="password" id="inputToken" placeholder="••••••••••••" autocomplete="off">
    </div>
    <button class="btn" onclick="autenticar()">Entrar</button>
    <div class="msg" id="msgLogin"></div>
  </div>

  <!-- Sección operaciones -->
  <div id="secOps">
    <div class="badge">✓ Autenticado</div>
    <h2>Reset de password</h2>
    <p class="sub" style="margin-bottom:16px">Selecciona un participante y asígnale un nuevo password.</p>

    <!-- Buscador -->
    <div class="campo buscador">
      <label>Buscar participante</label>
      <input type="text" id="inputBuscar" placeholder="Nombre..." oninput="filtrarLista()">
    </div>

    <!-- Lista -->
    <div class="lista-participantes" id="listaParticipantes">
      <div class="spinner-mini">Cargando...</div>
    </div>

    <!-- Participante seleccionado -->
    <div class="seleccionado-label" id="seleccionadoLabel"></div>

    <!-- Nuevo password -->
    <div class="campo">
      <label>Nuevo password</label>
      <input type="text" id="opPassword" placeholder="Mínimo 6 caracteres" autocomplete="off">
    </div>

    <button class="btn" id="btnReset" onclick="resetPassword()">Resetear password</button>
    <button class="btn btn-secondary" onclick="cerrarSesion()">Cerrar sesión</button>
    <div class="msg" id="msgOps"></div>
  </div>

</div>

<script>
const API = "https://us-central1-mundial-2026-amigos.cloudfunctions.net/api";
const SAL = "mqx26-ops-v1";
const HASH_ESPERADO = "5fbd9ba96860fed482d8820aebcb58df775ff23f078c3d72bcf1a4851e9588ae";

let tokenAutenticado = null;
let participantes = [];
let emailSeleccionado = null;

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('');
}

async function autenticar() {
  const token = document.getElementById('inputToken').value.trim();
  if (!token) return mostrarMsg('msgLogin', 'Ingresa el token', 'err');

  const hash = await sha256(token + SAL);
  if (hash !== HASH_ESPERADO) {
    return mostrarMsg('msgLogin', 'Token incorrecto', 'err');
  }

  tokenAutenticado = token;
  document.getElementById('secLogin').style.display = 'none';
  document.getElementById('secOps').style.display = 'block';
  cargarParticipantes();
}

async function cargarParticipantes() {
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion: 'adminParticipantes', adminSecret: tokenAutenticado })
    });
    const data = await r.json();
    if (data.ok) {
      participantes = data.participantes.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
      renderLista(participantes);
    } else {
      document.getElementById('listaParticipantes').innerHTML = '<div class="lista-vacia">Error al cargar</div>';
    }
  } catch {
    document.getElementById('listaParticipantes').innerHTML = '<div class="lista-vacia">Error de conexión</div>';
  }
}

function renderLista(lista) {
  if (!lista.length) {
    document.getElementById('listaParticipantes').innerHTML = '<div class="lista-vacia">Sin resultados</div>';
    return;
  }
  document.getElementById('listaParticipantes').innerHTML = lista.map(p => `
    <div class="part-item" id="item-${p.email}" onclick="seleccionar('${p.email}', '${p.nombre.replace(/'/g, "\\'")}')">
      <div class="part-nombre">${p.nombre}</div>
      <div class="part-email">${p.email}</div>
    </div>
  `).join('');
}

function filtrarLista() {
  const q = document.getElementById('inputBuscar').value.toLowerCase();
  const filtrados = participantes.filter(p => p.nombre.toLowerCase().includes(q) || p.email.toLowerCase().includes(q));
  renderLista(filtrados);
  // Mantener selección visual si sigue en lista
  if (emailSeleccionado) {
    const el = document.getElementById('item-' + emailSeleccionado);
    if (el) el.classList.add('seleccionado');
  }
}

function seleccionar(email, nombre) {
  emailSeleccionado = email;
  // Quitar selección anterior
  document.querySelectorAll('.part-item').forEach(el => el.classList.remove('seleccionado'));
  const el = document.getElementById('item-' + email);
  if (el) el.classList.add('seleccionado');
  // Mostrar label
  const lbl = document.getElementById('seleccionadoLabel');
  lbl.textContent = '👤 ' + nombre;
  lbl.style.display = 'block';
  // Limpiar msg y focus en password
  document.getElementById('msgOps').className = 'msg';
  document.getElementById('opPassword').focus();
}

async function resetPassword() {
  if (!emailSeleccionado) return mostrarMsg('msgOps', 'Selecciona un participante', 'err');
  const password = document.getElementById('opPassword').value.trim();
  const btn = document.getElementById('btnReset');

  if (!password) return mostrarMsg('msgOps', 'Ingresa el nuevo password', 'err');
  if (password.length < 6) return mostrarMsg('msgOps', 'Password mínimo 6 caracteres', 'err');

  btn.disabled = true; btn.textContent = 'Procesando...';

  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion: 'adminOpsReset', opsToken: tokenAutenticado, email: emailSeleccionado, nuevoPassword: password })
    });
    const data = await r.json();
    if (data.ok) {
      mostrarMsg('msgOps', `✓ Password de ${data.nombre} actualizado`, 'ok');
      document.getElementById('opPassword').value = '';
      emailSeleccionado = null;
      document.getElementById('seleccionadoLabel').style.display = 'none';
      document.querySelectorAll('.part-item').forEach(el => el.classList.remove('seleccionado'));
    } else {
      mostrarMsg('msgOps', data.error || 'Error desconocido', 'err');
    }
  } catch {
    mostrarMsg('msgOps', 'Error de conexión', 'err');
  }

  btn.disabled = false; btn.textContent = 'Resetear password';
}

function cerrarSesion() {
  tokenAutenticado = null;
  participantes = [];
  emailSeleccionado = null;
  document.getElementById('inputToken').value = '';
  document.getElementById('secOps').style.display = 'none';
  document.getElementById('secLogin').style.display = 'block';
  document.getElementById('msgLogin').className = 'msg';
  document.getElementById('msgOps').className = 'msg';
}

function mostrarMsg(id, texto, tipo) {
  const el = document.getElementById(id);
  el.textContent = texto;
  el.className = 'msg ' + tipo;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('secLogin').style.display !== 'none') autenticar();
  }
});
</script>
</body>
</html>
